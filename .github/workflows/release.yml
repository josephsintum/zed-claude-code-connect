name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: claude-code-connect-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: claude-code-connect-macos-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: claude-code-connect-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset: claude-code-connect-linux-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p claude-code-connect

      # The extension matches assets by exact name -- see asset_name in
      # resolve/src/lib.rs. A rename here silently breaks
      # installation on that platform, so the names must stay in step with that
      # function. asset_names_match_the_release_workflow reads this file and
      # fails if they drift.
      - name: Stage asset
        run: cp target/${{ matrix.target }}/release/claude-code-connect ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # The `gh` CLI rather than a release action, because uploads to the GitHub
      # asset API stall often enough to matter: three tags running (v0.1.1, v0.1.2,
      # v0.2.0) failed here and every one succeeded on an unmodified re-run. The
      # action has no retry input, so the only fix it allows is a human re-running
      # the job. This retries on its own.
      #
      # A part-uploaded release is the outcome to avoid: the extension finds it,
      # asks for the asset for its platform, and that one is the one missing. So
      # the release is created as a draft, every asset is uploaded into it, and
      # only then is it published. A run that dies partway leaves a draft, which
      # `latest_github_release` does not return.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # This job downloads artefacts and never checks the repository out, so
          # `gh` has no git remote to infer the repository from and must be told.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          assets=(claude-code-connect-*)
          if [ ${#assets[@]} -ne 4 ]; then
            echo "expected 4 assets, found ${#assets[@]}: ${assets[*]:-none}" >&2
            exit 1
          fi

          # Idempotent, so re-running the job after a partial failure works.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
          fi

          for asset in "${assets[@]}"; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$asset" --clobber; then
                echo "uploaded $asset"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "giving up on $asset after 5 attempts" >&2
                exit 1
              fi
              echo "upload of $asset failed, retrying (attempt $attempt)" >&2
              sleep $((attempt * 10))
            done
          done

          # Every asset is in place, so the release is safe to expose.
          gh release edit "$TAG" --draft=false

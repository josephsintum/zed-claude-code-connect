name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: claude-code-connect-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: claude-code-connect-macos-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: claude-code-connect-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset: claude-code-connect-linux-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p claude-code-connect

      # The extension matches assets by exact name -- see asset_name in
      # resolve/src/lib.rs. A rename here silently breaks
      # installation on that platform, so the names must stay in step with that
      # function. asset_names_match_the_release_workflow reads this file and
      # fails if they drift.
      - name: Stage asset
        run: cp target/${{ matrix.target }}/release/claude-code-connect ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # `preserve_order` uploads the assets one at a time. Uploading all four at
      # once stalled twice running -- v0.1.1 timed out with none uploaded, v0.1.2
      # with three of four -- and both needed a manual re-run. A part-uploaded
      # release is worse than a failed one: the extension finds it and then cannot
      # fetch the asset for the missing platform.
      #
      # The action has no retry input, so a stall still fails the job. That is the
      # right failure: re-run it with `gh run rerun <id> --failed`, which reuses
      # the built artefacts and only repeats the upload.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: claude-code-connect-*
          generate_release_notes: true
          preserve_order: true
          # A glob matching nothing means a build silently produced no binary.
          fail_on_unmatched_files: true

[workspace]
members = ["zed-claude-ide-resolve", "zed-claude-ide-server"]
resolver = "2"

# The companion is downloaded from a GitHub release and run by an editor, so its size
# is a cost every user pays once and its speed is never the bottleneck. Measured here:
# 5.43 MB -> 3.69 MB, a third smaller, for about 40 seconds of extra link time. Speed
# moved ~3%, which is noise at the rate Zed sends requests.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
# raw_value: LSP params stay borrowed text until a handler asks for their typed
# form, so a message is parsed once rather than twice.
serde_json = { version = "1.0", features = ["raw_value"] }
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
# The LSP wire types only. The framing, dispatch and initialize state machine are
# hand-written in src/lsp/: tower-lsp cost 12.6us per cursor move, measured.
lsp-types = "0.94"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
subtle = "2.6"
